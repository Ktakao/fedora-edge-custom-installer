set default="1"
set timeout=3
insmod all_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod ext2

search --no-floppy --set=root -l 'tmpfsroot-fedora'

menuentry 'Install Fedora (tmpfsroot) - AUTOMATIC, WIPES DISK' --class fedora --class gnu-linux --class gnu --class os {
  linuxefi /images/pxeboot/vmlinuz inst.stage2=hd:LABEL=tmpfsroot-fedora inst.ks=cdrom:/ks.cfg console=tty0 console=ttyS0,115200n8
  initrdefi /images/pxeboot/initrd.img
}
